{% extends 'blog/base.html' %}

{% block title %}Details{% endblock %}

{% block content %}
<div class="post">
    <h2>{{ post.title }}</h2>
    <p>{{ post.body }}</p>
    <small>Published on: {{ post.created_at|date:"Y-m-d" }}</small>
</div>

<a href="{% url 'home' %}">Back to main page</a>
{% endblock %}
