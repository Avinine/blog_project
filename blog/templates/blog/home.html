<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>Main blog page</title>
</head>
<body>
    <h1>My blog</h1>

    {% for post in posts %}
        <h2><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h2>
        <p>{{ post.content|truncatechars:100 }}</p>
        <hr>
    {% empty %}
        <p>There are no posts here yet!</p>
    {% endfor %}
</body>
</html>
