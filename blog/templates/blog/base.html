<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Blog{% endblock %}</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Vazirmatn', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        a {
            color: #80cbc4;
            text-decoration: none;
        }
        a:hover {
            color: #b2dfdb;
        }
        header {
            background-color: #1e1e1e;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .container {
            width: 80%;
            margin: 20px auto;
        }
        .post {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'home' %}">My Blog</a>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
